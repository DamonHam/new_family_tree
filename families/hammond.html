<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Hammond Family Tree</title>
  <link rel="stylesheet" href="../style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>

<body>
  <header class="site-header">
    <a href="../index.html" class="back-link center-back">&larr; Back to family list</a>
    <h1>Hammond Family Tree</h1>
    <p class="subtitle">Starting with Eileen and Curtis Hammond Sr.</p>
  </header>

  <main>
    <div class="tree-toolbar">
      <button id="zoom-out" type="button">-</button>
      <button id="zoom-reset" type="button">Reset</button>
      <button id="zoom-in" type="button">+</button>
    </div>

    <div class="tree-wrapper">
      <div class="tree" id="tree-canvas">
        <ul id="tree-root"></ul>
      </div>
    </div>
  </main>

  <script src="../data.js"></script>
  <script src="../tree.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      renderFamilyTree({
        rootParents: ["eileen", "curtis"],
        containerId: "tree-root",
        theme: "hammond"
      });

      setupTreeZoom("tree-canvas");
    });
  </script>
</body>
</html>
